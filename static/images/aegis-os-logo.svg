  <circle cx="60" cy="30" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="85" cy="50" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="78" cy="78" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="42" cy="78" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="35" cy="50" r="4" fill="#60a5fa" opacity="0.8"/>
  <!-- Connection lines -->
  <line x1="60" y1="30" x2="60" y2="47" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="85" y1="50" x2="68" y2="53" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="78" y1="78" x2="65" y2="61" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="42" y1="78" x2="55" y2="61" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="35" y1="50" x2="52" y2="53" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <!-- Outer ring connections -->
  <line x1="60" y1="30" x2="85" y2="50" stroke="#3b82f6" stroke-width="0.8" opacity="0.25"/>
  <line x1="85" y1="50" x2="78" y2="78" stroke="#3b82f6" stroke-width="0.8" opacity="0.25"/>
  <line x1="78" y1="78" x2="42" y2="78" stroke="#3b82f6" stroke-width="0.8" opacity="0.25"/>
  <line x1="42" y1="78" x2="35" y2="50" stroke="#3b82f6" stroke-width="0.8" opacity="0.25"/>
  <line x1="35" y1="50" x2="60" y2="30" stroke="#3b82f6" stroke-width="0.8" opacity="0.25"/>
