<meta name=keywords content><meta name=description content="ADHDからAI独立へ — TAKUYA HIRATAの軌跡"><meta name=author content="TAKUYA HIRATA"><link rel=canonical href=https://pyonkichi369.com/story/><link crossorigin=anonymous href=https://pyonkichi369.com/assets/css/stylesheet.a80a98315b7649f055c414ac772d513815172989220fe635b6b4216f9cbcc45c.css integrity="sha256-qAqYMVt2SfBVxBSsdy1ROBUXKYkiD+Y1trQhb5y8xFw=" rel="preload stylesheet" as=style><script defer crossorigin=anonymous src=https://pyonkichi369.com/assets/js/highlight.f413e19d0714851f6474e7ee9632408e58ac146fbdbe62747134bea2fa3415e0.js integrity="sha256-9BPhnQcUhR9kdOfuljJAjlisFG+9vmJ0cTS+ovo0FeA=" onload=hljs.initHighlightingOnLoad()></script><link rel=icon href=https://pyonkichi369.com/favicon.ico><link rel=icon type=image/png sizes=16x16 href=https://pyonkichi369.com/favicon-16x16.png><link rel=icon type=image/png sizes=32x32 href=https://pyonkichi369.com/favicon-32x32.png><link rel=apple-touch-icon href=https://pyonkichi369.com/apple-touch-icon.png><link rel=mask-icon href=https://pyonkichi369.com/safari-pinned-tab.svg><meta name=theme-color content="#F7F4EE"><meta name=msapplication-TileColor content="#F7F4EE"><link rel=alternate hreflang=ja href=https://pyonkichi369.com/story/><noscript><style>#theme-toggle,.top-link{display:none}</style></noscript><style>.breadcrumbs{margin-bottom:1rem}</style><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel=stylesheet><script async src="https://www.googletagmanager.com/gtag/js?id=G-HSQ9DBX6WJ"></script><script>var dnt,doNotTrack=!1;if(!1&&(dnt=navigator.doNotTrack||window.doNotTrack||navigator.msDoNotTrack,doNotTrack=dnt=="1"||dnt=="yes"),!doNotTrack){window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date),gtag("config","G-HSQ9DBX6WJ")}</script><meta property="og:title" content="Story"><meta property="og:description" content="ADHDからAI独立へ — TAKUYA HIRATAの軌跡"><meta property="og:type" content="article"><meta property="og:url" content="https://pyonkichi369.com/story/"><meta property="article:section" content><meta name=twitter:card content="summary"><meta name=twitter:title content="Story"><meta name=twitter:description content="ADHDからAI独立へ — TAKUYA HIRATAの軌跡"><script type=application/ld+json>{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Story","item":"https://pyonkichi369.com/story/"}]}</script><script type=application/ld+json>{"@context":"https://schema.org","@type":"BlogPosting","headline":"Story","name":"Story","description":"ADHDからAI独立へ — TAKUYA HIRATAの軌跡","keywords":[],"articleBody":"ADHDからAI独立へ これは「障害」と「AI」と「時間」の話です。\n2019 — 異常なほど「できない」エンジニア 新卒から大手企業でエンジニアとして働き始めた。スペック上は問題ない。東京の職場、年収800万円台、技術力もある。\nでも毎朝、出社するだけで限界だった。\n会議の議事録が書けない。複数プロジェクトの優先順位がつけられない。メールの返信を先延ばしにして1週間放置する。「なぜできないのか」が自分でもわからない。「意志が弱い」「怠け者」と自分を責め続けた。\n3年間、それを繰り返した。\n2022 — ADHD・うつ病・不安症の診断 心療内科に行ったのは、朝ベッドから起き上がれなくなってからだった。\n診断結果: ADHD（注意欠陥多動性障害）+ うつ病 + 不安症\n医師に言われた言葉が今でも残っている。\n「あなたのやり方が悪いんじゃない。脳の仕組みが違うから、同じやり方では機能しないんです」\n「できない」のではなく、「合っていない」だったのだ。\n2023 — 退職と、AIとの出会い 年収828万円の仕事を辞めた。\n貯金を取り崩しながら、「自分に合った仕事のやり方」を探し始めた。その過程でClaude Code、ChatGPT、Geminiを触り始める。\nふと気づいた。\nADHDで苦手なことを、AIが全部得意としていた。\n優先順位の決定 → AIにスコア化させる メールの下書き → AIに書かせて選ぶだけ 情報の整理 → AIに要約・分類させる 感情のループ → AIに客観化プロンプトを投げる 脳の外部化。それが、独立への道だった。\n2024 — AIと独立 合同会社AJARAを設立。代表社員。\n技術力を活かしたAI動画制作の受託と、ADHDの当事者として「脳の特性をAIで補う方法」をnoteで発信し始める。\n最初のnote記事は10人しか読んでいなかった。でもフォロワーは少しずつ増えていった。「自分だけじゃなかった」「ADHDで悩んでいたのに、これで変わった」というメッセージが届くようになった。\n2025〜現在 — 記録の公開 現在、ADHDの当事者経営者として、以下を発信しています。\nnote（89本以上）:\nADHD×AI：優先順位・タスク開始・情報処理の外部化プロトコル うつ病×AI：SNS比較ループ断絶、モチベーション管理 不安症×AI：価格交渉、請求書送付、人間関係の心理的負担軽減 独立×AI：収益安定化、フリーランス経営の実務 このブログとnoteは、「自分にはできない」と思っていた3年前の自分に届けるために書いています。\nnoteで読む →\nこのブログで得られること ADHDや精神疾患と向き合いながら、AIを使って仕事を作る具体的な方法 失敗した実験と、うまくいった実験の両方の記録 「障害がある自分」を責めるのをやめ、「AIで補う自分」に切り替えるための視点 技術的な話よりも、「どう生きるか」に近い話が多いです。\nプロトコル一覧を見る →\n","wordCount":"67","inLanguage":"ja","datePublished":"0001-01-01T00:00:00Z","dateModified":"0001-01-01T00:00:00Z","author":{"@type":"Person","name":"TAKUYA HIRATA"},"mainEntityOfPage":{"@type":"WebPage","@id":"https://pyonkichi369.com/story/"},"publisher":{"@type":"Organization","name":"TAKUYA HIRATA","logo":{"@type":"ImageObject","url":"https://pyonkichi369.com/favicon.ico"}}}</script></head><body id=top><script>localStorage.getItem("pref-theme")==="dark"&&document.body.classList.add("dark")</script><header class=header><nav class=nav><div class=logo><a href=https://pyonkichi369.com/ accesskey=h title="TAKUYA (Alt + H)">TAKUYA</a><div class=logo-switches><button id=theme-toggle accesskey=t title="(Alt + T)"><svg id="moon" width="24" height="18" viewBox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg><svg id="sun" width="24" height="18" viewBox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button><ul class=lang-switch><li>|</li><li><a href=https://pyonkichi369.com/en/ title=English aria-label=English>En</a></li></ul></div></div><ul id=menu><li><a href=https://pyonkichi369.com/ title=HOME><span>HOME</span></a></li><li><a href=https://pyonkichi369.com/story/ title=STORY><span class=active>STORY</span></a></li><li><a href=https://pyonkichi369.com/protocols/ title=PROTOCOLS><span>PR
