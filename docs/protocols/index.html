","G-HSQ9DBX6WJ")}</script><meta property="og:title" content="Protocols"><meta property="og:description" content="ADHDとうつ病と不安症のためのAIプロトコル集"><meta property="og:type" content="article"><meta property="og:url" content="https://pyonkichi369.com/protocols/"><meta property="article:section" content><meta name=twitter:card content="summary"><meta name=twitter:title content="Protocols"><meta name=twitter:description content="ADHDとうつ病と不安症のためのAIプロトコル集"><script type=application/ld+json>{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Protocols","item":"https://pyonkichi369.com/protocols/"}]}</script><script type=application/ld+json>{"@context":"https://schema.org","@type":"BlogPosting","headline":"Protocols","name":"Protocols","description":"ADHDとうつ病と不安症のためのAIプロトコル集","keywords":[],"articleBody":"AIプロトコル集 脳の特性をAIで補うために開発・実践してきたプロトコルの一覧です。\n各プロトコルの詳細と実際のプロンプトはnoteで公開しています（¥500〜¥980）。\nADHD × AI プロトコル 優先順位プロトコル 問題: 複数のタスクが全部「同じ重さ」に見えて、何から始めるか決められない。\n毎朝3分でAIにプロジェクトをスコア化させ、1つのタスクだけに集中する仕組み。ADHD脳の「判断疲れ」を根本から解消。\nnoteで読む →\nタスク開始プロトコル 問題: 優先順位はわかっているのに、体が動かない「開始の地獄」。\n大きなタスクを「25分で完結できるサイズ」に砕き、「開始トリガー」を設定する。実行機能障害を構造で回避する方法。\nnoteで読む →\n情報過多パニック解消プロトコル 問題: メール・Slack・タスク管理・会議メモが一度に押し寄せてフリーズする。\nAIに「今日絶対に必要なもの」と「後でいいもの」を仕分けさせる。ADHD脳のワーキングメモリ制限を外部システムで補う。\nnoteで読む →\nうつ病 × AI プロトコル SNS比較ループ断絶プロトコル 問題: 他人の成功投稿を見た後、1週間仕事への意欲が消える。\n「感情の客観化プロンプト」と「行動の明確化プロンプト」の2段階で、脳のループをリセットする方法。\nnoteで読む →\nモチベーション回復プロトコル 問題: 「何もしたくない日」に罪悪感だけが積み上がり、さらに動けなくなる。\n「30分で完結できる最小成功」をAIに設計させ、ドーパミン受容体を段階的に正常化する。\nnoteで読む →\n不安症 × AI プロトコル 価格交渉プロトコル 問題: 「値上げしたい」のに3年間できなかった。拒絶への恐怖が論理を上回る。\nAIに「クライアントが値上げに応じる心理的・ビジネス的理由」を分析させ、値上げが「お願い」から「提案」に変わる認知転換。\nnoteで読む →\n請求書送付プロトコル 問題: 仕事が終わっているのに、請求書が送れない。放置するほど難易度が上がる悪循環。\nAIに文面を丸ごと委任することで、「完璧性バイアス」から解放される。送信までの心理コストをゼロにする。\nnoteで読む →\n謝罪・連絡プロトコル 問題: 「遅れてしまった」「ミスした」を伝えるのが怖くて、さらに放置してしまう。\n謝罪メールをAIに生成させ、関係を最短で修復する。「謝ることで怒られる」という不安を構造で解消。\nnoteで読む →\n独立 × AI プロトコル 収益安定化プロトコル 問題: フリーランス・個人事業主の収入が月によって大きく変動して不安が続く。\n収入源を複数に分散し、AIで各チャネルの状態を定期的にスコアリングする仕組み。\nnoteで読む →\nクライアント対応プロトコル 問題: クライアントとのやりとりで精神的に消耗し、本来の仕事に集中できない。\n対応の9割をAIにテンプレート化させ、感情コストを最小化する。「プロとしての対応」をAIが保証する。\nnoteで読む →\n全プロトコルはnoteで 詳細なプロンプト・実際の使用例・成果の数字は、すべてnoteで公開しています。\n記事単体: ¥500 / ¥980 発信媒体: note.com/th19930828 無料記事あり（まず読んでみてください） noteを見る →\n","wordCount":"90","inLanguage":"ja","datePublished":"0001-01-01T00:00:00Z","dateModified":"0001-01-01T00:00:00Z","author":{"@type":"Person","name":"TAKUYA HIRATA"},"mainEntityOfPage":{"@type":"WebPage","@id":"https://pyonkichi369.com/protocols/"},"publisher":{"@type":"Organization","name":"TAKUYA HIRATA","logo":{"@type":"ImageObject","url":"https://pyonkichi369.com/favicon.ico"}}}</script></head><body id=top><script>localStorage.getItem("pref-theme")==="dark"&&document.body.classList.add("dark")</script><header class=header><nav class=nav><div class=logo><a href=https://pyonkichi369.com/ accesskey=h title="TAKUYA (Alt + H)">TAKUYA</a><div class=logo-switches><button id=theme-toggle accesskey=t title="(Alt + T)"><svg id="moon" width="24" height="18" viewBox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg><svg id="sun" width="24" height="18" viewBox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button><ul class=lang-switch><li>|</li><li><a href=https://pyonkichi369.com/en/ title=English aria-label=English>En</a></li></ul></div></div><ul id=menu><li><a href=https://pyonkichi369.com/ title=HOME><span>HOME</s
